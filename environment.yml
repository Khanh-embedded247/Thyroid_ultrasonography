name: thyus2path
channels:
  - pytorch
  - defaults
dependencies:
  - python=3.10
  - pip
  # Pin version để ổn định binary và tránh xung đột
  - pytorch=2.4.*
  - torchvision=0.19.*
  # Cung cấp symbol iJIT_NotifyEvent cho một số bản libtorch_cpu
  - intel-openmp
  - pip:
      - pillow
      - tqdm
      - numpy
      - pandas
      - scikit-learn
      - matplotlib
      - seaborn
      - gradio
      - tensorboard
